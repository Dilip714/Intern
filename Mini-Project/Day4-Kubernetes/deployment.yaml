apiVersion: apps/v1
kind: Deployment

metadata:
  name: miniapp-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: miniapp

  template:
    metadata:
      labels:
        app: miniapp

    spec:
      containers:
      - name: miniapp
        image: dilipdev714/miniapp:v1
        ports:
        - containerPort: 5000